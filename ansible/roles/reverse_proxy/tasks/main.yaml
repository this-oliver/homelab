- name: Preflight checks
  ansible.builtin.include_tasks: ../../../tasks/preflight.yaml
  when: not (preflight_passed | default(false) | bool)

- name: Install reverse proxy
  ansible.builtin.include_tasks:
    file: setup.yaml
  when: not (uninstall | bool)

- name: Uninstall reverse proxy
  ansible.builtin.include_tasks:
    file: teardown.yaml
  when: uninstall | bool
