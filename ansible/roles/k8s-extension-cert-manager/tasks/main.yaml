# Objective: Setup Cert Manager.
#
# Supported variables:
# - uninstall <boolean> - (Optional) Uninstalls Cert Manager if set to true.
# - cert_manager_version <string> - (Optional) Version of Cert Manager to install.
# - cert_manager_pk_path <string> - (Optional) Path where the public key for Cert Manager is stored.

- name: Install Cert Manager
  when: uninstall is false
  block:
    - name: Install Repo via Helm
      become: true
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

    - name: Install Release via Helm
      become: true
      kubernetes.core.helm:
        chart_ref: jetstack/cert-manager
        chart_version: "{{ cert_manager_version }}"
        release_name: cert-manager
        release_namespace: cert-manager
        release_state: present
        create_namespace: true
        update_repo_cache: true
        wait: true

- name: Uninstall Cert Manager
  when: uninstall is true
  block:
    - name: Uninstall Cert Manager via Helm
      become: true
      ansible.builtin.command: helm uninstall cert-manager -n cert-manager
