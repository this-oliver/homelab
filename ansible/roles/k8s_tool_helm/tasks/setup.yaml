- name: Check if helm is installed
  ansible.builtin.command: which helm
  register: k8s_tool_helm_installed
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install Helm
  become: true
  community.general.snap:
    classic: true
    channel: "{{ k8s_tool_helm_version }}"
    name: helm
  when: k8s_tool_helm_installed.stdout == ''
