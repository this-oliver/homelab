- name: Fail when HTTPS is enabled without an ACME email
  ansible.builtin.assert:
    quiet: true
    that: homelab.gateway.https.email | length > 0
    fail_msg: >-
      homelab.gateway.https.email (env HOMELAB_DOMAIN_HTTPS_EMAIL) is required
      when homelab.monitor.domain is set and homelab.gateway.https.enabled is true.
      Provide an email for Let's Encrypt certificate management, or set
      homelab.gateway.https.enabled to false to serve the domain over plain HTTP.
  when:
    - homelab.monitor.domain | length > 0
    - homelab.gateway.https.enabled | bool

- name: Warn when the domain is served over plain HTTP
  ansible.builtin.debug:
    msg: >-
      homelab.gateway.https.enabled is false: '{{ homelab.monitor.domain }}' will be
      served over unencrypted HTTP. Set homelab.gateway.https.enabled to true and
      HOMELAB_DOMAIN_HTTPS_EMAIL to enable HTTPS via Let's Encrypt.
  when:
    - homelab.monitor.domain | length > 0
    - not (homelab.gateway.https.enabled | bool)

- name: Install {{ helm_release.name }}
  ansible.builtin.include_tasks: ../../../tasks/helm.yaml
  vars:
    helm_release: "{{ k8s_extension_traefik_helm_release }}"
