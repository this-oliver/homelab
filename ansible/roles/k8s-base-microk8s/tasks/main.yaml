# Objective: This task installs microk8s. It also supports
# uninstalling microk8s and installing specific addons.
#
# Supported variables:
# - uninstall <boolean> - true causes task to uninstall microk8s

- name: Check if microk8s snap is installed
  ansible.builtin.command: snap list microk8s
  register: microk8s_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set microk8s_installed fact
  when: microk8s_check.rc == 0
  set_fact:
    microk8s_installed: true

- name: Install microk8s
  when: uninstall is false
  block:
    - name: Install Snap
      become: true
      ansible.builtin.apt:
        state: present
        pkg:
          - snapd

    - name: Install Microk8s
      become: true
      community.general.snap:
        classic: true
        channel: "{{ '1.30' if raspi | default(false) else '1.35' }}"
        name: microk8s

    - name: Add "{{ ansible_facts['user_id'] }}" user to microk8s group
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: microk8s
        append: true

    - name: Add microk8s group to "/home/{{ ansible_facts['user_id'] }}/.kube"
      become: true
      ansible.builtin.file:
        path: "/home/{{ ansible_facts['user_id'] }}/.kube"
        group: microk8s
        state: directory
        mode: 2750
        recurse: true

    - name: Start microk8s
      become: true
      ansible.builtin.command: microk8s start

    - name: Wait for microk8s
      become: true
      ansible.builtin.command: microk8s status --wait-ready

    - name: Configure for Raspberry Pi
      block:
        # see https://canonical.com/microk8s/docs/install-raspberry-pi
        - name: Install Raspberry Pi deps (Raspi Only)
          become: true
          ansible.builtin.apt:
            state: present
            pkg:
              - linux-modules-extra-raspi
          when:
            - raspi | default(false) is true
            - ansible_facts["distribution"] == 'Ubuntu'
            - ansible_facts["distribution_version"] is version('24.04', '<')

        - name: Stat boot cmdline locations for cgroup params (Raspi Only)
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /boot/firmware/cmdline.txt
            - /boot/firmware/nobtcmd.txt
          register: cmdline_stat
          when: raspi | default(false) is true

        - name: Set list of existing cmdline files (Raspi Only)
          ansible.builtin.set_fact:
            cmdline_files: "{{ cmdline_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
          when: raspi | default(false) is true

        # see https://canonical.com/microk8s/docs/install-raspberry-pi
        - name: Ensure cgroup memory kernel params are present in boot cmdline (Raspi Only)
          become: true
          ansible.builtin.lineinfile:
            path: "{{ item }}"
            regexp: '^(?!.*cgroup_enable=memory)(.*)$'
            line: '\1 cgroup_enable=memory cgroup_memory=1'
            backrefs: true
            backup: true
          loop: "{{ cmdline_files }}"
          when: raspi | default(false) is true and cmdline_files | length > 0
          register: cmdline_updated

        - name: Reboot to apply kernel cgroup params (Raspi Only)
          become: true
          ansible.builtin.reboot:
            reboot_timeout: 120
          when:
            - raspi | default(false) is true
            - cmdline_updated is changed

    - name: Enable microk8s common modules
      become: true
      ansible.builtin.command: microk8s enable {{ item }}
      loop: "{{ addon }}"

    - name: Configure for Kubectl CLI
      block:
        - name: Check if kubectl is installed
          ansible.builtin.command: which kubectl
          register: kubectl_check
          failed_when: false
          changed_when: false
          check_mode: false

        - name: Set kubectl_installed fact
          when: kubectl_check.rc == 0
          set_fact:
            kubectl_installed: true

        - name: Ensure KubeConfig file exists
          become: true
          ansible.builtin.file:
            path: "{{ kubeconfig_path }}"
            state: touch
            group: microk8s
            mode: 640

        - name: Extract MicroK8s Kubectl Config
          become: true
          ansible.builtin.command: microk8s config
          register: kubeconfig_output
          when: kubectl_installed is true

        - name: Write KubeConfig to file
          become: true
          ansible.builtin.copy:
            content: "{{ kubeconfig_output.stdout }}"
            dest: "{{ kubeconfig_path }}"
            group: microk8s
            mode: 640
            remote_src: true
          when: kubectl_installed is true

        - name: Add KUBECONFIG env to system
          become: true
          ansible.builtin.lineinfile:
            path: /etc/environment
            regexp: 'KUBECONFIG="?(\/[a-zA-Z0-9\.]+)+"?'
            line: KUBECONFIG="{{ kubeconfig_path }}"
            create: yes
          when: kubectl_installed is true

- name: Uninstall microk8s
  when: uninstall is true
  block:
    - name: Uninstall microk8s snap
      become: true
      community.general.snap:
        state: absent
        name:
          - microk8s
      when: microk8s_installed is true
