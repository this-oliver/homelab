# Objective: Setup dashboard for microk8s.
#
# Requirements:
# - Ensure that the microk8s snap is installed on the system
#
# Supported variables:
# - uninstall: <boolean> - true causes task to uninstall microk8s

- name: Check if microk8s snap is installed
  command: snap list microk8s
  register: microk8s_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install Dashboard
  when: uninstall is false and microk8s_check.rc == 0
  block:
    - name: Enable rbac
      become: true
      ansible.builtin.command: microk8s enable rbac

    - name: Copy config file
      ansible.builtin.copy:
        src: values.yaml
        dest: /tmp/values.yaml
        mode: '0400'

    - name: Install Repo via Helm
      become: true
      kubernetes.core.helm_repository:
        name: headlamp
        repo_url: https://kubernetes-sigs.github.io/headlamp/

    - name: Install Release via Helm
      become: true
      kubernetes.core.helm:
        chart_ref: headlamp/headlamp
        chart_version: "{{ headlamp_version }}"
        release_name: headlamp
        release_namespace: kube-system
        release_state: present
        create_namespace: true
        update_repo_cache: true
        wait: true
        values_files:
          - /tmp/values.yaml

    - name: Remove config file
      become: true
      ansible.builtin.file:
        path: /tmp/values.yaml
        state: absent

- name: Uninstall Dashboard
  when: uninstall is true and microk8s_check.rc == 0
  block:
    - name: Uninstall Release via Helm
      become: true
      ansible.builtin.command: helm uninstall headlamp
