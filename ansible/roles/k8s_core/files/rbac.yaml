---
# Keeps an eye on systems.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observer
rules:
  - apiGroups:
      - '' # indicates the core API group
    resources:
      - namespaces
      - configmaps
      - pods
      - services
      - persistentvolumeclaims
    verbs:
      - get
      - list
  - apiGroups:
      - 'apps'
    resources:
      - deployments
    verbs:
      - get
      - list
  - apiGroups: [traefik.io]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
    verbs:
      - list
      - get
---
# Restarts deployments when they fail. Destroys
# pods when they become stubborn
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fixer
rules:
  - apiGroups:
      - '' # indicates the core API group
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - 'apps'
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - update
