- name: Uninstall microk8s snap
  become: true
  community.general.snap:
    state: absent
    name: microk8s

- name: Delete Kubernetes Config file
  become: true
  ansible.builtin.file:
    path: "{{ homelab.dir }}/.kube/config.yaml"
    state: absent

- name: Uninstall Kubectl
  become: true
  community.general.snap:
    name: kubectl
    state: absent

- name: Uninstall Helm
  become: true
  community.general.snap:
    name: helm
    state: absent
