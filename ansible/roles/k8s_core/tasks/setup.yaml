- name: Check if host runs on Raspberry Pi
  ansible.builtin.slurp:
    src: /sys/firmware/devicetree/base/model
  register: k8s_core_pi_model
  failed_when: false
  changed_when: false
  check_mode: false

- name: Check if microk8s snap is installed
  ansible.builtin.command: snap list microk8s
  register: k8s_core_microk8s_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set facts
  ansible.builtin.set_fact:
    k8s_core_is_raspi: "{{ (k8s_core_pi_model.content | default('') | b64decode) is search('Raspberry Pi') }}"
    k8s_core_has_microk8s: "{{ k8s_core_microk8s_check.rc == 0 }}"

- name: Setup KubeConfig
  block:
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "{{ homelab.dir }}/.kube"
        group: homelab
        state: directory
        mode: '760'

    - name: Ensure KubeConfig file exists
      ansible.builtin.file:
        path: "{{ homelab.dir }}/.kube/config.yaml"
        group: homelab
        state: touch
        mode: '660'

    - name: Add KUBECONFIG env
      become: true
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: 'KUBECONFIG='
        line: "KUBECONFIG=\"{{ homelab.dir }}/.kube/config.yaml\""
        create: true
        mode: '660'

- name: Skip Microk8s setup
  when: k8s_core_has_microk8s | bool
  ansible.builtin.debug:
    msg: "Skipping microk8s setup because it already exists"

- name: Install Kubernetes
  become: true
  when: not (k8s_core_has_microk8s | bool)
  block:
    - name: Install Snap
      ansible.builtin.apt:
        name: snapd
        state: present

    - name: Install Microk8s
      community.general.snap:
        classic: true
        channel: "{{ homelab.k8s.version }}"
        name: microk8s

    - name: Start microk8s
      ansible.builtin.command: microk8s start
      register: k8s_core_started
      changed_when: k8s_core_started.rc != 0

    - name: Wait for microk8s
      ansible.builtin.command: microk8s status --wait-ready
      register: k8s_core_ready
      changed_when: k8s_core_ready.rc != 0

    - name: Set the node role of this host
      ansible.builtin.set_fact:
        k8s_core_node_role: >-
          {{ 'controllers' if inventory_hostname in (groups.controllers | default([])) else 'workers' }}

    - name: Set list of addons to enable for this host
      ansible.builtin.set_fact:
        k8s_core_addons_to_enable: >-
          {{ k8s_core_addons | selectattr(k8s_core_node_role, 'equalto', true) | map(attribute='name') | list }}

    - name: Enable microk8s common modules
      ansible.builtin.command: "microk8s enable {{ addon }}"
      register: k8s_core_addon_enabled
      changed_when: k8s_core_addon_enabled.rc != 0
      loop: "{{ k8s_core_addons_to_enable }}"
      loop_control:
        loop_var: addon

- name: Update Kubeconfig file
  block:
    - name: Extract MicroK8s Kubectl Config
      become: true
      ansible.builtin.command: microk8s config
      register: k8s_core_kubeconfig_output
      changed_when: k8s_core_kubeconfig_output.rc != 0

    - name: Update Kubernetes Config file
      ansible.builtin.copy:
        content: "{{ k8s_core_kubeconfig_output.stdout }}"
        dest: "{{ homelab.dir }}/.kube/config.yaml"
        remote_src: true
        group: homelab
        mode: '660'
      register: k8s_core_kubeconfig_updated

- name: Configure Kubernetes for Raspberry Pi
  when: k8s_core_is_raspi | default(false) is true
  block:
    # see https://canonical.com/microk8s/docs/install-raspberry-pi
    - name: Install Raspberry Pi dependencies
      become: true
      ansible.builtin.apt:
        state: present
        pkg:
          - linux-modules-extra-raspi
      when:
        - ansible_facts["distribution"] == 'Ubuntu'
        - ansible_facts["distribution_version"] is version('24.04', '<')

    - name: Stat boot cmdline locations for cgroup params
      ansible.builtin.stat:
        path: "{{ cmdline }}"
      loop:
        - /boot/firmware/cmdline.txt
        - /boot/firmware/nobtcmd.txt
      loop_control:
        loop_var: cmdline
      register: k8s_core_cmdline_stat

    - name: Set list of existing cmdline files
      ansible.builtin.set_fact:
        k8s_core_cmdline_files: "{{ k8s_core_cmdline_stat.results | default([]) | selectattr('stat.exists') | map(attribute='cmdline') | list }}"

    # see https://canonical.com/microk8s/docs/install-raspberry-pi
    - name: Ensure cgroup memory kernel params are present in boot cmdline
      become: true
      ansible.builtin.lineinfile:
        path: "{{ cmdline_file }}"
        regexp: '^(?!.*cgroup_enable=memory)(.*)$'
        line: '\1 cgroup_enable=memory cgroup_memory=1'
        backrefs: true
        backup: true
      loop: "{{ k8s_core_cmdline_files }}"
      loop_control:
        loop_var: cmdline_file
      when: k8s_core_cmdline_files | length > 0
      notify:
        - Reboot to apply Microk8s changes
