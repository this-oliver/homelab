- name: Preflight checks
  ansible.builtin.include_tasks: ../../../tasks/preflight.yaml
  when: not (preflight_passed | default(false) | bool)

- name: Install Kubernetes
  when: not (uninstall | bool)
  ansible.builtin.include_tasks:
    file: setup.yaml
  tags: [kubernetes]

- name: Uninstall Kubernetes
  when: uninstall | bool
  ansible.builtin.include_tasks:
    file: teardown.yaml
  tags: [kubernetes]
