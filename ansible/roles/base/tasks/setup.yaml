- name: Ensure homelab group exists
  become: true
  ansible.builtin.group:
    name: homelab
    state: present

- name: Add user to homelab group - "{{ ansible_facts['user_id'] }}"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: homelab
    append: true

- name: Ensure homelab directory exists
  ansible.builtin.file:
    path: "{{ homelab.dir }}"
    state: directory
    group: homelab
    mode: '760'

- name: Install basic tools
  become: true
  ansible.builtin.apt:
    pkg:
      - curl
