- name: Set facts
  ansible.builtin.set_fact:
    base_summary_host: "{{ inventory_hostname }}"
    base_summary_host_type: "{{ group_names[0] }}"
    base_summary_kubeconfig: "{{ homelab.dir }}/.kube/config.yaml"
    base_summary_tls: "{{ homelab.domain.url | length > 0 and homelab.domain.https.enabled | bool and homelab.domain.https.email | length > 0 }}"
    base_summary_origin: "{{ (homelab.domain.url | length > 0) | ternary(homelab.domain.url, base_summary_host) }}"
    base_summary_scheme: "{{ (base_summary_tls | default(false) | bool) | ternary('https', 'http') }}"

- name: Get live cluster state
  block:
    - name: Get the Kubernetes API server version
      ansible.builtin.command:
        cmd: kubectl version -o json
      environment:
        KUBECONFIG: "{{ base_summary_kubeconfig }}"
      delegate_to: "{{ groups.controller[0] }}"
      register: base_summary_api_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Get the current kubectl context
      ansible.builtin.command:
        cmd: kubectl config current-context
      environment:
        KUBECONFIG: "{{ base_summary_kubeconfig }}"
      delegate_to: "{{ groups.controller[0] }}"
      register: base_summary_context
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Get the installed Helm releases
      ansible.builtin.command:
        cmd: helm list --all-namespaces -o json
      delegate_to: "{{ groups.controller[0] }}"
      register: base_summary_releases
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Get the cluster nodes
      ansible.builtin.command:
        cmd: kubectl get nodes -o json
      environment:
        KUBECONFIG: "{{ base_summary_kubeconfig }}"
      delegate_to: "{{ groups.controller[0] }}"
      register: base_summary_nodes
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Get the deployed ingress routes
      ansible.builtin.command:
        cmd: kubectl get ingressroute.traefik.io --all-namespaces -o json
      delegate_to: "{{ groups.controller[0] }}"
      environment:
        KUBECONFIG: "{{ base_summary_kubeconfig }}"
      register: base_summary_routes
      changed_when: false
      failed_when: false
      check_mode: false

- name: Render the homelab summary
  ansible.builtin.template:
    src: README.md.j2
    dest: "{{ homelab.dir }}/README.md"
    group: homelab
    mode: '660'

- name: Print the access summary
  ansible.builtin.debug:
    msg: >-
      Homelab summary written to {{ homelab.dir }}/README.md. SSH into the
      machine to start hacking.
