---
# Uninstall body. Loaded by homelab.yaml on `-e uninstall=true`, or run directly.
#
# Every role is included with `tasks_from: teardown.yaml`, so this playbook
# names the teardown path itself and no task needs a `when` of its own. That
# bypasses each role's tasks/main.yaml dispatch, which is also why no
# `uninstall: true` play var is needed here: the variable stays false in
# config.yaml and only the install body reads it.

- name: Teardown homelab controller
  hosts: controller
  vars_files:
    - config.yaml
  vars:
    uninstall: true
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [uninstall, reverse_proxy, gateway, dashboard]
      tags: [uninstall, reverse_proxy, gateway, dashboard]
  tasks:
    - name: Reverse proxy
      ansible.builtin.include_role:
        name: reverse_proxy
        tasks_from: teardown.yaml
        apply:
          tags: [uninstall, reverse_proxy]
      tags: [uninstall, reverse_proxy]

    - name: Dashboard - Headlamp, Prometheus, OpenCost, Trivy
      ansible.builtin.include_role:
        name: k8s_extension_headlamp
        tasks_from: teardown.yaml
        apply:
          tags: [uninstall, dashboard]
      tags: [uninstall, dashboard]

    - name: Gateway - Traefik
      ansible.builtin.include_role:
        name: k8s_extension_traefik
        tasks_from: teardown.yaml
        apply:
          tags: [uninstall, gateway]
      tags: [uninstall, gateway]

- name: Teardown homelab core
  hosts: all
  vars_files:
    - config.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [uninstall, k8s, kubernetes]
      tags: [uninstall, k8s, kubernetes]
  tasks:
    - name: Kubernetes
      ansible.builtin.include_role:
        name: k8s_core
        tasks_from: teardown.yaml
        apply:
          tags: [uninstall, k8s, kubernetes]
      tags: [uninstall, k8s, kubernetes]

    - name: Homelab summary
      ansible.builtin.include_role:
        name: base
        tasks_from: teardown.yaml
        apply:
          tags: [uninstall, summary]
      tags: [uninstall, summary]
