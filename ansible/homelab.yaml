---
# Install body. It runs the layers in dependency order so the reverse proxy is
# never installed before the ingress gateway it fronts.

- name: Teardown homelab cluster
  ansible.builtin.import_playbook: homelab_uninstall.yaml
  when: uninstall | default(false) | bool

- name: Bootstrap nodes
  hosts: all
  vars_files:
    - config.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [untagged, base, kubernetes, kubectl, helm, worker]
      tags: [untagged, base, kubernetes, kubectl, helm, worker]
  tasks:
    - name: Base setup
      ansible.builtin.include_role:
        name: base
        apply:
          tags: [base]
      tags: [base]
      when: not (uninstall | default(false) | bool)

    - name: Kubernetes
      ansible.builtin.include_role:
        name: k8s_core
        tasks_from: setup.yaml
        apply:
          tags: [kubernetes, kubectl, helm]
      tags: [kubernetes, kubectl, helm]
      when: not (uninstall | default(false) | bool)

- name: Provision homelab controllers
  hosts: controllers
  vars_files:
    - config.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [untagged, networking, traefik, monitor, headlamp, dashboard, trivy, reverse_proxy]
      tags: [untagged, networking, traefik, monitor, headlamp, dashboard, trivy, reverse_proxy]
  tasks:
    - name: Network Gateway - Traefik
      ansible.builtin.include_role:
        name: k8s_extension_traefik
        tasks_from: setup.yaml
        apply:
          tags: [networking, traefik]
      tags: [networking, traefik]
      when: not (uninstall | default(false) | bool)

    - name: Dashboard - Headlamp
      ansible.builtin.include_role:
        name: k8s_extension_headlamp
        tasks_from: setup.yaml
        apply:
          tags: [monitor, headlamp, dashboard, trivy]
      tags: [monitor, headlamp, dashboard, trivy]
      when: not (uninstall | default(false) | bool)

    - name: Reverse proxy
      ansible.builtin.include_role:
        name: reverse_proxy
        tasks_from: setup.yaml
        apply:
          tags: [reverse_proxy]
      tags: [reverse_proxy]
      when: not (uninstall | default(false) | bool)

- name: Provision homelab workers
  hosts: workers
  vars_files:
    - config.yaml
  tasks:
    - name: Join worker node to the cluster
      ansible.builtin.include_tasks:
        file: roles/k8s_core/tasks/worker.yaml
        apply:
          tags: [kubernetes, worker]
      tags: [kubernetes, worker]
      when: not (uninstall | default(false) | bool)
