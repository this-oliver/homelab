---
# Install body. It runs the layers in dependency order so the reverse proxy is
# never installed before the ingress gateway it fronts.

- name: Teardown homelab cluster
  ansible.builtin.import_playbook: homelab_uninstall.yaml
  when: uninstall | bool

- name: Bootstrap nodes
  hosts: all
  vars_files:
    - config.yaml
  vars:
    uninstall: false
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [base, kubernetes, kubectl, helm, worker]
      tags: [base, kubernetes, kubectl, helm, worker]
      when: not (uninstall | bool)

    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [base, kubernetes, kubectl, helm, worker]
      tags: [base, kubernetes, kubectl, helm, worker]
      when: not (uninstall | bool) and not (preflight_passed | default(false) | bool)
  tasks:
    - name: Base setup
      ansible.builtin.include_role:
        name: base
        apply:
          tags: [base]
      tags: [base]
      when: not (uninstall | bool)

    - name: Kubernetes
      ansible.builtin.include_role:
        name: k8s_core
        tasks_from: setup.yaml
        apply:
          tags: [kubernetes, kubectl, helm]
      tags: [kubernetes, kubectl, helm]
      when: not (uninstall | bool)

- name: Provision homelab controller
  hosts: controller
  vars_files:
    - config.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [ingress, traefik, monitor, headlamp, dashboard, trivy, reverse_proxy]
      tags: [ingress, traefik, monitor, headlamp, dashboard, trivy, reverse_proxy]
      when: not (uninstall | bool)

    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [ingress, traefik, monitor, headlamp, dashboard, trivy, reverse_proxy]
      tags: [ingress, traefik, monitor, headlamp, dashboard, trivy, reverse_proxy]
      when: not (uninstall | bool) and not (preflight_passed | default(false) | bool)
  tasks:
    - name: Ingress Gateway - Traefik
      ansible.builtin.include_role:
        name: k8s_extension_traefik
        tasks_from: setup.yaml
        apply:
          tags: [ingress, traefik]
      tags: [ingress, traefik]
      when: not (uninstall | bool)

    - name: Dashboard - Headlamp
      ansible.builtin.include_role:
        name: k8s_extension_headlamp
        tasks_from: setup.yaml
        apply:
          tags: [monitor, headlamp, dashboard, trivy]
      tags: [monitor, headlamp, dashboard, trivy]
      when: not (uninstall | bool) and homelab.monitor.headlamp_dashboard.enabled

    - name: Reverse proxy
      ansible.builtin.include_role:
        name: reverse_proxy
        tasks_from: setup.yaml
        apply:
          tags: [reverse_proxy]
      tags: [reverse_proxy]
      when: not (uninstall | bool)

- name: Provision homelab workers
  hosts: workers
  vars_files:
    - config.yaml
  pre_tasks:
    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [kubernetes, worker]
      tags: [kubernetes, worker]
      when: not (uninstall | bool) and not (preflight_passed | default(false) | bool)
  tasks:
    - name: Join worker node to the cluster
      ansible.builtin.include_tasks:
        file: roles/k8s_core/tasks/worker.yaml
        apply:
          tags: [kubernetes, worker]
      tags: [kubernetes, worker]
      when: not (uninstall | bool)

- name: Publish homelab summary
  hosts: all
  vars_files:
    - config.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [summary]
      tags: [summary]
      when: not (uninstall | bool)
    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [summary]
      tags: [summary]
      when: not (uninstall | bool) and not (preflight_passed | default(false) | bool)
  tasks:
    - name: Homelab summary
      ansible.builtin.include_role:
        name: base
        tasks_from: summary.yaml
        apply:
          tags: [summary]
      tags: [summary]
      when: not (uninstall | bool)
