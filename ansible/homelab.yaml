---
# Install body. It runs the layers in dependency order so the reverse proxy is
# never installed before the ingress gateway it fronts.

- name: Teardown homelab cluster
  ansible.builtin.import_playbook: homelab_uninstall.yaml
  tags: [uninstall]
  when: uninstall | default(false) | bool or "'uninstall' in ansible_run_tags | default([])"

- name: Provision homelab core
  hosts: all
  vars_files:
    - config.yaml
  when: "'uninstall' not in ansible_run_tags | default([]) and not uninstall | default(false) | bool"
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [base, k8s, kubernetes]
      tags: [base, k8s, kubernetes]

    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [base, k8s, kubernetes]
      tags: [base, k8s, kubernetes]
  tasks:
    - name: Base setup
      ansible.builtin.include_role:
        name: base
        apply:
          tags: [base]
      tags: [base]

    - name: Kubernetes
      ansible.builtin.include_role:
        name: k8s_core
        tasks_from: setup.yaml
        apply:
          tags: [k8s, kubernetes]
      tags: [k8s, kubernetes]

- name: Provision homelab controller
  hosts: controller
  vars_files:
    - config.yaml
  when: "'uninstall' not in ansible_run_tags | default([]) and not uninstall | default(false) | bool"
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [reverse_proxy, gateway, dashboard]
      tags: [reverse_proxy, gateway, dashboard]

    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [reverse_proxy, gateway, dashboard]
      tags: [reverse_proxy, gateway, dashboard]
  tasks:
    - name: Gateway - Traefik
      ansible.builtin.include_role:
        name: k8s_extension_traefik
        tasks_from: setup.yaml
        apply:
          tags: [gateway]
      tags: [gateway]

    - name: Dashboard - Headlamp, Prometheus, OpenCost, Trivy
      ansible.builtin.include_role:
        name: k8s_extension_headlamp
        tasks_from: setup.yaml
        apply:
          tags: [dashboard]
      tags: [dashboard]

    - name: Reverse Proxy - HAProxy
      ansible.builtin.include_role:
        name: reverse_proxy
        tasks_from: setup.yaml
        apply:
          tags: [reverse_proxy]
      tags: [reverse_proxy]
      when: not (uninstall | bool)

- name: Provision homelab workers
  hosts: workers
  vars_files:
    - config.yaml
  when: "'uninstall' not in ansible_run_tags | default([]) and not uninstall | default(false) | bool"
  pre_tasks:
    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [kubernetes, worker]
      tags: [kubernetes, worker]
  tasks:
    - name: Join worker node to the cluster
      ansible.builtin.include_tasks:
        file: roles/k8s_core/tasks/worker.yaml
        apply:
          tags: [kubernetes, worker]
      tags: [kubernetes, worker]

- name: Provision homelab summary
  hosts: all
  vars_files:
    - config.yaml
  when: "'uninstall' not in ansible_run_tags | default([]) and not uninstall | default(false) | bool"
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.include_tasks:
        file: tasks/resolve_path.yaml
        apply:
          tags: [always]
      tags: [always]
    - name: Preflight check
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
        apply:
          tags: [always]
      tags: [always]
  tasks:
    - name: Homelab summary
      ansible.builtin.include_role:
        name: base
        tasks_from: summary.yaml
        apply:
          tags: [always]
      tags: [always]
