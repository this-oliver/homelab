# ── Homelab ─────────────────────────────────────────────────────────

homelab:
  # General config
  general:
    k8s:
      # [OPTIONAL] Kubernetes version used for the cluster.
      version: 1.36

    # [OPTIONAL] Path for the homelab directory. A leading `~` is converted to an
    # absolute path by resolving against the connecting user's home (the playbook
    # rewrites it to an absolute path before any role runs).
    dir: "~/homelab"

  # Network access to the cluster and its applications.
  gateway:
    http:
      # [OPTIONAL] Enables HTTP. (Defualt: true)
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_GATEWAY_HTTP_ENABLED') | default(true, true) | bool }}"
      # [OPTIONAL] Defines the port to listen to for HTTP requests. (Defualt: 80)
      port: "{{ lookup('ansible.builtin.env', 'HOMELAB_GATEWAY_HTTP_PORT') | int | default(80, true) }}"
    https:
      # [OPTIONAL] Enables HTTPS. (Defualt: true)
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_GATEWAY_HTTPS_ENABLED') | default(true, true) | bool }}"
      # [OPTIONAL] Defines the port to listen to for HTTPS requests. (Defualt: 443)
      port: "{{ lookup('ansible.builtin.env', 'HOMELAB_GATEWAY_HTTPS_PORT') | int | default(443, true) }}"
      # [OPTIONAL] Defines the email to use when managing certificates.
      email: "{{ lookup('ansible.builtin.env', 'HOMELAB_GATEWAY_HTTPS_EMAIL') | regex_replace('^\"|\"$', '') }}"

  # Cluster dashboard
  dashboard:
    # [OPTIONAL] Defines a domain that the cluster's dashboards will sit behind. If
    # no domain is set then the dashboards are configured to sit behind the host's
    # IP. (Default: null)
    domain: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_DOMAIN') | regex_replace('^\"|\"$', '') }}"

    # Dashboard for cluster management.
    headlamp_dashboard:
      # [OPTIONAL] Enables the headlamp dashboard. (Defualt: true)
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_HEADLAMP_DASHBOARD_ENABLED') | default(true, true) | bool }}"

      # A plugin that displays the cost of resources like pods.
      opencost:
        # [OPTIONAL] Enables the opencost plugin. (Defualt: false)
        enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_HEADLAMP_DASHBOARD_OPENCOST_ENABLED') | default('false') | bool }}"

      # A plugin that displays compute metrics (i.e. cpu and memory usage).
      prometheus:
        # [OPTIONAL] Enables the prometheus plugin. (Defualt: true)
        enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_HEADLAMP_DASHBOARD_PROMETHEUS_ENABLED') | default(true, true) | bool }}"

      # A plugin that scans the cluster for security vulnerabilities.
      trivy:
        # [OPTIONAL] Enables the trivy plugin. (Defualt: false)
        enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_HEADLAMP_DASHBOARD_TRIVY_ENABLED') | default('false') | bool }}"

    # Dashboard for traefik (networking) services and middlewares.
    traefik_dashboard:
      # [OPTIONAL] Enables the traefik dashboard. (Defualt: false)
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_TRAEFIK_DASHBOARD_ENABLED') | default('false') | bool }}"

      # Credentials for admin account for services.
      auth:
        # [REQUIRED] Sets the username for authenticating to the traefik dashboard.
        username: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_TRAEFIK_DASHBOARD_AUTH_USERNAME') | regex_replace('^\"|\"$', '') }}"
        # [REQUIRED] Sets the password for authenticating to the traefik dashboard.
        password: "{{ lookup('ansible.builtin.env', 'HOMELAB_DASHBOARD_TRAEFIK_DASHBOARD_AUTH_PASSWORD') | regex_replace('^\"|\"$', '') }}"

# ── MISC ─────────────────────────────────────────────────────────

# INTERNAL. Read in two places, both of them the install side:
#   - homelab.yaml routes on it, so `-e uninstall=true` picks the teardown body.
#   - each role's tasks/main.yaml dispatches setup vs teardown on it, so an
#     install needs it false.
# The teardown body needs no play var: it names tasks_from: teardown.yaml on each
# role instead. Leave this false; you never edit it.
uninstall: false
