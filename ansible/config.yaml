# ── Homelab ─────────────────────────────────────────────────────────

homelab:
  # OPTIONAL. Path for the homelab directory. A leading `~` is resolved
  # against the connecting user's home (the playbook rewrites it to an
  # absolute path before any role runs).
  dir: "~/homelab"

  k8s:
    # OPTIONAL. Kubernetes version consumed by the kubectl and kubernetes
    # roles.
    version: 1.36

  # REQUIRED. Credentials for admin account for services. Read from the
  # environment so no secrets are committed to version control:
  #   export HOMELAB_ADMIN_USERNAME=admin
  #   export HOMELAB_ADMIN_PASSWORD=change-me
  admin:
    username: "{{ lookup('ansible.builtin.env', 'HOMELAB_ADMIN_USERNAME') | regex_replace('^\"|\"$', '') }}"
    password: "{{ lookup('ansible.builtin.env', 'HOMELAB_ADMIN_PASSWORD') | regex_replace('^\"|\"$', '') }}"

  # Optional. Define which ports to listen to for incoming requests
  # to your homelab + deployment. This config will be used to setup
  # the reverse proxy that forwards external requests into the homelab.
  ingress:
    http:
      port: "{{ lookup('ansible.builtin.env', 'HOMELAB_INGRESS_HTTP_PORT') | int | default(80, true) }}"
    https:
      port: "{{ lookup('ansible.builtin.env', 'HOMELAB_INGRESS_HTTPS_PORT') | int | default(443, true) }}"

  # OPTIONAL. When the homelab sits behind a public domain, set the
  # domain url.
  domain:
    url: "{{ lookup('ansible.builtin.env', 'HOMELAB_DOMAIN_URL') | regex_replace('^\"|\"$', '') }}"
    https:
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_DOMAIN_HTTPS_ENABLED') | bool | default(true, true) }}"
      email: "{{ lookup('ansible.builtin.env', 'HOMELAB_DOMAIN_HTTPS_EMAIL') | regex_replace('^\"|\"$', '') }}"

  # OPTIONAL. Configures monitor operations for cluster
  monitor:
    opencost:
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_MONITOR_OPENCOST_ENABLED') | bool | default(true, true) }}"
    prometheus:
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_MONITOR_PROMETHEUS_ENABLED') | bool | default(true, true) }}"
    trivy:
      enabled: "{{ lookup('ansible.builtin.env', 'HOMELAB_MONITOR_TRIVY_ENABLED') | bool | default(false) }}"

# ── MISC ─────────────────────────────────────────────────────────

# INTERNAL. Read in two places, both of them the install side:
#   - homelab.yaml routes on it, so `-e uninstall=true` picks the teardown body.
#   - each role's tasks/main.yaml dispatches setup vs teardown on it, so an
#     install needs it false.
# The teardown body needs no play var: it names tasks_from: teardown.yaml on each
# role instead. Leave this false; you never edit it.
uninstall: false
