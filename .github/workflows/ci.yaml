name: Continuous Integration
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

jobs:
  check-commit-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # fetch all history for commitlint to work

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest

      - name: Install commitlint
        run: |
          npm install commitlint@latest @commitlint/config-conventional

      - name: Lint PR Title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint --verbose --config .github/config/commitlint.yaml

      - name: Lint PR commits
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        run: |
            npx commitlint --config .github/config/commitlint.yaml \
              --from ${{ github.event.pull_request.base.sha }} \
              --to ${{ github.event.pull_request.head.sha }} \
              --verbose

  check-ansible-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint ansible files
        run: ansible-lint ansible/
