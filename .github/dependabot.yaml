# .github/dependabot.yml
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(dep): "
    groups:
      safe-updates-version:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      safe-updates-security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(dep): "
    groups:
      safe-updates-version:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      safe-updates-security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
