name: Feature request
description: Suggest an idea
labels: [feature]
projects:
  - madomorpho-com/2
title: 'FEATURE: '
body:
  - type: textarea
    attributes:
      label: Problem?
      description: What is the problem that you are trying to solve?
      placeholder: I can't [...]
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
