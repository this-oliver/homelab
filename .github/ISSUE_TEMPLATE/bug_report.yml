name: Bug report
description: Create a report to help us improve
labels: [bug]
type: bug
projects:
  - madomorpho-com/2
title: 'BUG: '
body:
  - type: textarea
    attributes:
      label: What is the problem?
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |-
        ### Details

  - type: dropdown
    attributes:
      label: Device
      description: What device are you using?
      options:
        - desktop
        - mobile
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Browser
      description: What browser are you using?
      options:
        - chrome
        - safari
        - firefox
        - edge
        - other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
