---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-app-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 0.5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: simple-web
          image: ghcr.io/this-oliver/simple-web-app:v1.0.1@sha256:12f7dfc283ebf48f50284187bb56269b179b605f15a26a92baec8d836d9d0073
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: LOGS_FILEPATH
              value: /app/logs/requests.txt
          ports:
            - containerPort: 3000
              name: demo-app-http
          volumeMounts:
            - name: storage
              mountPath: /app/logs
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: demo-app-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: demo-app-http
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-basic-auth
type: kubernetes.io/basic-auth
stringData:
  username: admin # required field for kubernetes.io/basic-auth
  password: password # required field for kubernetes.io/basic-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-middleware-auth
spec:
  basicAuth:
    secret: demo-basic-auth
---
# See: https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/ingress/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure,web"
    traefik.ingress.kubernetes.io/router.middlewares: "default-demo-middleware-auth@kubernetescrd" # Note: middlewares should follow this format - <NAMESPACE>-<MIDDLEWARE_NAME>@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "defaultCertResolver"
spec:
  ingressClassName: traefik
  rules:
  - host: demo.oliverr.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-app
            port:
              number: 80
