# ── Homelab ─────────────────────────────────────────────────────────

homelab:
  # REQUIRED. Credentials for admin account for services. Read from the
  # environment so no secrets are committed to version control:
  #   export HOMELAB_ADMIN_USERNAME=admin
  #   export HOMELAB_ADMIN_PASSWORD=change-me
  admin:
    username: "{{ lookup('ansible.builtin.env', 'HOMELAB_ADMIN_USERNAME') | regex_replace('^\"|\"$', '') }}"
    password: "{{ lookup('ansible.builtin.env', 'HOMELAB_ADMIN_PASSWORD') | regex_replace('^\"|\"$', '') }}"

  # OPTIONAL. Path for the homelab directory. A leading `~` is resolved
  # against the connecting user's home (the playbook rewrites it to an
  # absolute path before any role runs).
  dir: "~/homelab"

  # OPTIONAL. When the homelab sits behind a public domain, set the
  # domain url. When https.enabled is true, then https.email
  # is required for TLS certificate management (Let's Encrypt/ACME)
  # and its absence fails the run. Setting https.enabled to false
  # serves the domain over plain HTTP.
  domain:
    url: "{{ lookup('ansible.builtin.env', 'HOMELAB_DOMAIN_NAME') | regex_replace('^\"|\"$', '') }}"
    https:
      enabled: true
      email: "{{ lookup('ansible.builtin.env', 'HOMELAB_DOMAIN_HTTPS_EMAIL') | regex_replace('^\"|\"$', '') }}"

  # OPTIONAL. Whether the homelab is installed on a cloud provider.
  # If homelab is installed on a cloud provider then there are
  # considerations that must be taken into account like how to expose
  # the Traefik ingress, for example.
  cloud: "{{ lookup('ansible.builtin.env', 'HOMELAB_CLOUD') | regex_replace('^\"|\"$', '') | bool | default(False) }}"

# ── Kubernetes ──────────────────────────────────────────────────────

# OPTIONAL. Kubernetes version for the APT repository and MicroK8s
# channel. Shared by the kubectl and microk8s roles.
k8s_version: 1.36

# ── MISC ─────────────────────────────────────────────────────────

# OPTIONAL. Uninstalls homelab if set to true.
uninstall: false
