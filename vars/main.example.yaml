# ── General ─────────────────────────────────────────────────────────

# (optional) Path for the homelab directory.
# Default: ~/homelab
homelab_dir: "~/homelab"

# (optional) Uninstall all components instead of installing them.
# Default: false
uninstall: false

# (optional) Set to true if running in a cloud provider environment.
# Skips MetalLB installation (cloud providers supply their own load balancers).
# Default: false
cloud: false

# ── Kubernetes ──────────────────────────────────────────────────────

# (optional) Path for the Kubernetes config file.
# Default: ~/.kube/config.yaml
kubeconfig_path: "~/.kube/config.yaml"

# (optional) Kubernetes version for the APT repository.
# Default: 1.36
k8s_version: 1.36

# (optional) Helm version to install.
# Default: 3.21.1
helm_version: 3.21.1

# ── MicroK8s ────────────────────────────────────────────────────────

# (optional) List of microk8s addons to enable.
# Default: [cis-hardening, dns, helm, helm3, hostpath-storage, rbac]
addons:
  - cis-hardening
  - dns
  - helm
  - helm3
  - hostpath-storage
  - rbac

# ── MetalLB ─────────────────────────────────────────────────────────

# REQUIRED. IP address pool for MetalLB load balancing.
# Accepted formats:
#   Single IP:   10.0.0.100
#   IP range:    10.0.0.100-10.0.0.200
#   Comma list:  10.0.0.100,10.0.0.101,10.0.0.102
metallb_ip_pool: 0.0.0.0

# ── Traefik ─────────────────────────────────────────────────────────

# (optional) Traefik Helm chart version.
# Default: 41.0.2
traefik_chart_version: 41.0.2

# (optional) Domain for TLS. Leave empty for local-only access (e.g. traefik.local).
# When set, enables Let's Encrypt ACME and HTTP→HTTPS redirect.
# traefik_domain: homelab.example.com

# (required when traefik_domain is set) Let's Encrypt email for ACME.
# traefik_acme_email: you@example.com

# ── Cert Manager ────────────────────────────────────────────────────

# (optional) Cert Manager Helm chart version.
# Default: v1.21.0
cert_manager_chart_version: v1.21.0

# ── Headlamp ───────────────────────────────────────────────────────

# (optional) Headlamp dashboard Helm chart version.
# Default: 0.43.0
headlamp_chart_version: 0.43.0
