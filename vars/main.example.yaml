# ── General ─────────────────────────────────────────────────────────

# REQUIRED. Credentials for admin account for services.
homelab_admin_username:
homelab_admin_password:

# OPTIONAL. Path for the homelab directory.
homelab_dir: "~/homelab"

# OPTIONAL. Uninstall all components instead of installing them.
uninstall: false

# OPTIONAL. Set to true if running in a cloud provider environment.
# Skips MetalLB installation (cloud providers supply their own load balancers).
cloud: false

# ── Kubernetes ──────────────────────────────────────────────────────

# OPTIONAL. Path for the Kubernetes config file.
kubeconfig_path: "~/.kube/config.yaml"

# OPTIONAL. Kubernetes version for the APT repository.
k8s_version: 1.36

# OPTIONAL. Helm version to install.
helm_version: 3.21.1

# ── MetalLB ─────────────────────────────────────────────────────────

# REQUIRED. IP address pool for MetalLB load balancing.
# Accepted formats:
#   Single IP:   10.0.0.100
#   IP range:    10.0.0.100-10.0.0.200
#   Comma list:  10.0.0.100,10.0.0.101,10.0.0.102
metallb_ip_pool: {{ undef() }}

# ── Traefik ─────────────────────────────────────────────────────────

# OPTIONAL. Ingress rule for Treafik Dashboard. If
# left undefined, the dashboard is disabled. For more
# information about how to write a rule, visit https://doc.traefik.io/traefik/reference/routing-configuration/http/routing/rules-and-priority/#rules
# Examples include:
# - ClientIP(`123.123.123.123`)
# - Host(`example.com`)
traefik_dashboard_ingress_rule: ""
