---
- name: Bootstrap all nodes
  hosts: all
  vars_files:
    - ../vars/main.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.set_fact:
        homelab: "{{ homelab | combine({'dir': homelab.dir | regex_replace('^~', ansible_facts['user_dir'])}) }}"
  tasks:
    - name: Basic
      when: not (uninstall | bool)
      ansible.builtin.include_role:
        name: ../roles/common

- name: Provision Kubernetes controllers
  hosts: controllers
  vars_files:
    - ../vars/main.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.set_fact:
        homelab: "{{ homelab | combine({'dir': homelab.dir | regex_replace('^~', ansible_facts['user_dir'])}) }}"
  tasks:
    - name: Prepare installation roles
      ansible.builtin.set_fact:
        homelab_roles:
          - ../roles/k8s-base-kubectl
          - ../roles/k8s-base-helm
          - ../roles/k8s-base-microk8s
          - ../roles/k8s-extension-metallb
          - ../roles/k8s-extension-gateway
          - ../roles/k8s-extension-cert-manager
          - ../roles/k8s-extension-traefik
          - ../roles/k8s-extension-headlamp
          - ../roles/k8s-summary
      when: not (uninstall | bool)

    - name: Prepare uninstall roles
      ansible.builtin.set_fact:
        homelab_roles:
          - ../roles/k8s-base-microk8s
          - ../roles/k8s-base-helm
          - ../roles/k8s-base-kubectl
      when: uninstall | bool

    - name: Execute roles
      ansible.builtin.include_role:
        name: "{{ role }}"
      loop: "{{ homelab_roles }}"
      loop_control:
        loop_var: role

- name: Provision reverse proxy
  hosts: reverse_proxy
  vars_files:
    - ../vars/main.yaml
  pre_tasks:
    - name: Resolve homelab directory to an absolute path
      ansible.builtin.set_fact:
        homelab: "{{ homelab | combine({'dir': homelab.dir | regex_replace('^~', ansible_facts['user_dir'])}) }}"
  tasks:
    - name: Ensure homelab/reverse_proxy directory exists
      ansible.builtin.file:
        path: "{{ homelab.dir }}/reverse-proxy"
        state: directory

    - name: Prepare installation roles
      ansible.builtin.set_fact:
        homelab_roles:
          - ../roles/tool-podman
      when: not (uninstall | bool)

    - name: Prepare uninstall roles
      ansible.builtin.set_fact:
        homelab_roles:
          - ../roles/tool-podman
      when: uninstall | bool

    - name: Execute roles
      ansible.builtin.include_role:
        name: "{{ role }}"
      loop: "{{ homelab_roles }}"
      loop_control:
        loop_var: role
