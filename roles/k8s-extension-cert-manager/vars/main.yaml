# Structural vars. User-configurable vars are declared in vars/schema.yaml (top-level).
helm_release:
  name: cert-manager
  namespace: cert-manager
  chart:
    ref: jetstack/cert-manager
    version: "v1.21.0"
  repo:
    name: jetstack
    url: https://charts.jetstack.io
  config: "{{ lookup('ansible.builtin.file', 'values.yaml') | from_yaml }}"
