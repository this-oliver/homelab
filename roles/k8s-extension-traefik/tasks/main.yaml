- name: Uninstall Traefik
  when: uninstall is true
  block:
    # - name: Delete Traefik resources
    #   become: true
    #   ansible.builtin.command: helm uninstall traefik -n traefik
    - name: Disable Traefik via Microk8s
      become: true
      ansible.builtin.command: microk8s disable traefik
