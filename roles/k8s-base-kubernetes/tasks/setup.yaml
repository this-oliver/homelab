- name: Check if host runs on Raspberry Pi
  ansible.builtin.slurp:
    src: /sys/firmware/devicetree/base/model
  register: pi_model
  failed_when: false
  changed_when: false
  check_mode: false

- name: Check if microk8s snap is installed
  ansible.builtin.command: snap list microk8s
  register: microk8s_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set facts
  set_fact:
    is_raspi: "{{ (pi_model.content | default('') | b64decode) is search('Raspberry Pi') }}"
    has_microk8s: "{{ microk8s_check.rc == 0 }}"

- name: Setup KubeConfig
  block:
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path:  "{{ homelab.dir }}/.kube"
        group: homelab
        state: directory
        mode: 0750

    - name: Ensure KubeConfig file exists
      ansible.builtin.file:
        path: "{{ homelab.dir }}/.kube/config.yaml"
        group: homelab
        state: touch
        mode: 0640

    - name: Add KUBECONFIG env
      become: true
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: 'KUBECONFIG='
        line: "KUBECONFIG=\"{{ homelab.dir }}/.kube/config.yaml\""
        create: yes

- when: has_microk8s | bool
  ansible.builtin.debug:
    msg: "Skipping microk8s setup because it already exists"

- name: Install Kubernetes
  become: true
  when: not (has_microk8s | bool)
  block:
    - name: Install Snap
      ansible.builtin.apt:
        name: snapd
        state: present

    - name: Install Microk8s
      community.general.snap:
        classic: true
        channel: "{{ homelab.k8s.version }}"
        name: microk8s

    - name: Start microk8s
      ansible.builtin.command: microk8s start

    - name: Wait for microk8s
      ansible.builtin.command: microk8s status --wait-ready

    - name: Enable microk8s common modules
      ansible.builtin.command: "microk8s enable {{ addon }}"
      loop: "{{ addons }}"
      loop_control:
        loop_var: addon

- name: Update Kubeconfig file
  block:
    - name: Extract MicroK8s Kubectl Config
      become: true
      ansible.builtin.command: microk8s config
      register: kubeconfig_output

    - name: Update Kubernetes Config file
      ansible.builtin.copy:
        content: "{{ kubeconfig_output.stdout }}"
        dest: "{{ homelab.dir }}/.kube/config.yaml"
        remote_src: true
        group: homelab
      register: kubeconfig_updated

- name: Configure Kubernetes for Raspberry Pi
  when: is_raspi | default(false) is true
  block:
    # see https://canonical.com/microk8s/docs/install-raspberry-pi
    - name: Install Raspberry Pi dependencies
      become: true
      ansible.builtin.apt:
        state: present
        pkg:
          - linux-modules-extra-raspi
      when:
        - ansible_facts["distribution"] == 'Ubuntu'
        - ansible_facts["distribution_version"] is version('24.04', '<')

    - name: Stat boot cmdline locations for cgroup params
      ansible.builtin.stat:
        path: "{{ cmdline }}"
      loop:
        - /boot/firmware/cmdline.txt
        - /boot/firmware/nobtcmd.txt
      loop_control:
        loop_var: cmdline
      register: cmdline_stat

    - name: Set list of existing cmdline files
      ansible.builtin.set_fact:
        cmdline_files: "{{ cmdline_stat.results | default([]) | selectattr('stat.exists') | map(attribute='cmdline') | list }}"

    # see https://canonical.com/microk8s/docs/install-raspberry-pi
    - name: Ensure cgroup memory kernel params are present in boot cmdline
      become: true
      ansible.builtin.lineinfile:
        path: "{{ cmdline_file }}"
        regexp: '^(?!.*cgroup_enable=memory)(.*)$'
        line: '\1 cgroup_enable=memory cgroup_memory=1'
        backrefs: true
        backup: true
      loop: "{{ cmdline_files }}"
      loop_control:
        loop_var: cmdline_file
      when: cmdline_files | length > 0
      register: cmdline_updated

    - name: Reboot to apply Microk8s changes
      become: true
      ansible.builtin.reboot:
        reboot_timeout: 120
      when: cmdline_updated is changed
