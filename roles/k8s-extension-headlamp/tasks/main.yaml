# See vars/main.yaml (top-level) and this role's vars/main.yaml for configuration.

- name: Install Headlamp
  ansible.builtin.include_tasks:
    file: setup.yaml
  when: not (uninstall | bool)

- name: Uninstall Headlamp
  ansible.builtin.include_tasks:
    file: teardown.yaml
  when: uninstall | bool
