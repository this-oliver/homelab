- name: Run shared preflight checks
  ansible.builtin.include_tasks: ../../../tasks/preflight.yaml

- name: Install Podman
  ansible.builtin.include_role:
    name: ../roles/podman

- name: Ensure HAProxy config directory exists
  ansible.builtin.file:
    path: "{{ reverse_proxy.dir }}"
    state: directory
    group: homelab

- name: Template HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ reverse_proxy.dir }}/haproxy.cfg"
    group: homelab

- name: Run HAProxy container
  become: true
  containers.podman.podman_container:
    name: "{{ reverse_proxy.container.name }}"
    image: "{{ reverse_proxy.container.image }}"
    state: started
    restart_policy: unless-stopped
    network: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - "{{ reverse_proxy.dir }}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
