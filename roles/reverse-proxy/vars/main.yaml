reverse_proxy:
  dir: "{{ homelab.dir }}/haproxy"
  container:
    name: reverse-proxy
    image: "docker.io/haproxy:3.4.4-alpine@sha256:c0afc4864dca9c68694cd1290433f0ee79b5c55be80f6745a165ffe373b9a564"
    user: haproxy
  http:
    listen_port: 80
    node_port: 30080
  https:
    listen_port: 443
    node_port: 30443
  firewall:
    loopback:
      ipv4: "127.0.0.1/32"
      ipv6: "::1/128"
