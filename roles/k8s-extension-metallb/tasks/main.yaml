# See vars/main.yaml (top-level) and this role's vars/main.yaml for configuration.

- name: Create Metallb Namespace
  when: not (uninstall | bool)
  block:
    - name: Create temporary metallb dir
      ansible.builtin.tempfile:
        state: directory
      register: metallb_dir

    - name: Copy namespace.yaml templat to metallb dir
      ansible.builtin.template:
        src: templates/namespace.yaml.j2
        dest: "{{metallb_dir.path}}/namespace.yaml"

    - name: Create metallb namespace
      ansible.builtin.command: "kubectl apply -n {{ release_namespace }} -f {{metallb_dir.path}}/namespace.yaml"

- name: Install {{ release_name }}
  ansible.builtin.include_tasks: ../../k8s-base-helm/tasks/install.yaml
  vars:
    chart_version: "{{ metallb_chart_version }}"

- name: Configure Metallb
  when: not (uninstall | bool)
  block:
    - name: Copy metallb config file to metallb dir
      ansible.builtin.template:
        src: templates/config.yaml.j2
        dest: "{{metallb_dir.path}}/config.yaml"

    - name: Wait for metallb controller to be ready
      ansible.builtin.command: "kubectl -n {{ release_namespace }} rollout status deployment/metallb-controller --timeout=300s"

    - name: Apply metallb config
      ansible.builtin.command: "kubectl apply -n {{ release_namespace }} -f {{metallb_dir.path}}/config.yaml"

- name: Cleanup
  when: not (uninstall | bool)
  block:
    - name: Delete metallb dir
      ansible.builtin.file:
        path: "{{ metallb_dir.path }}"
        state: absent
