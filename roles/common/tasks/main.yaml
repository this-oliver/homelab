- name: Setting up homelab basics
  when: not (uninstall | bool)
  block:
    - name: Install welcome file
      become: true
      ansible.builtin.template:
        src: ../templates/welcome.txt.j2
        dest: /home/{{ansible_user}}/welcome.txt
        owner: root
        group: root
        mode: 644

    - name: Create homelab group
      become: true
      ansible.builtin.group:
        name: homelab
        state: present

    - name: Add "{{ ansible_facts['user_id'] }}" user to homelab group
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: homelab
        append: true

    - name: Create /homelab directory
      become: true
      ansible.builtin.file:
        path: /homelab
        state: directory
        group: homelab
        mode: 2750

    - name: Install basic tools
      become: true
      ansible.builtin.apt:
        pkg:
          - curl
