- name: Install Helm
  when: not (uninstall | bool)
  block:
    - name: Install Helm dependnencies
      become: true
      ansible.builtin.apt:
        pkg:
          - apt-transport-https
          - curl
          - gpg

# See vars/main.yaml (top-level) and this role's vars/main.yaml for configuration.

- name: Install Helm
  ansible.builtin.script:
    cmd: script.sh --version "{{ helm_version }}"

- name: Uninstall Helm
  when: uninstall | bool
  block:
    - name: Uninstall Helm
      become: true
      ansible.builtin.file:
        path: /usr/local/bin/helm
        state: absent
