# See vars/main.yaml (top-level) and this role's vars/main.yaml for configuration.

- name: Install Kubectl
  when: not (uninstall | bool)
  block:
    - name: Install Kubectl
      become: true
      community.general.snap:
        classic: true
        channel: "{{ k8s_version }}"
        name: kubectl

- name: Uninstall Kubectl
  when: uninstall | bool
  block:
    - name: Uninstall Kubectl
      become: true
      community.general.snap:
        classic: true
        channel: "{{ k8s_version }}"
        name: kubectl
        state: absent
