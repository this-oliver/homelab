# See vars/main.yaml (top-level) and this role's vars/main.yaml for configuration.

- name: Install Kubectl
  when: not (uninstall | bool)
  block:
    - name: Install Kubectl dependencies
      become: true
      ansible.builtin.apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Dearmor and install Kubernetes GPG key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes APT repository
      become: true
      deb822_repository:
        name: kubernetes
        types: deb
        uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Install kubectl
      become: true
      ansible.builtin.apt:
        name: kubectl

- name: Uninstall Kubectl
  when: uninstall | bool
  block:
    - name: Uninstall kubectl
      become: true
      ansible.builtin.apt:
        name: kubectl
        state: absent
